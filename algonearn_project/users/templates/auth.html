<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkAuth | Вход и регистрация</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --dark-bg: #0f172a;
            --dark-surface: #1e293b;
            --dark-card: #334155;
            --light-text: #f8fafc;
            --light-text-secondary: #cbd5e1;
            --border: #475569;
            --shadow: rgba(0, 0, 0, 0.3);
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--light-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 50% 80%, rgba(139, 92, 246, 0.07) 0%, transparent 20%);
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: var(--light-text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        .auth-card {
            background-color: var(--dark-surface);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px var(--shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(99, 102, 241, 0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 8s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: rotate(45deg) translateX(-50%) translateY(-50%); }
            100% { transform: rotate(45deg) translateX(50%) translateY(50%); }
        }

        .form-container {
            position: relative;
            z-index: 2;
        }

        .tabs {
            display: flex;
            background-color: var(--dark-card);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 32px;
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            color: var(--light-text-secondary);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .tab-btn.active {
            color: var(--light-text);
        }

        .tab-indicator {
            position: absolute;
            top: 6px;
            left: 6px;
            height: calc(100% - 12px);
            width: calc(50% - 6px);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .form {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .form.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--light-text-secondary);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--light-text-secondary);
            font-size: 1.1rem;
            z-index: 1;
        }

        .input-field {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background-color: var(--dark-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--light-text);
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .input-field:hover {
            border-color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--light-text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .checkbox-group input:checked + .checkbox-custom {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-group input:checked + .checkbox-custom::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .checkbox-group input {
            display: none;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite linear;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .submit-btn:hover::after {
            opacity: 1;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--light-text-secondary);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border);
        }

        .divider span {
            padding: 0 16px;
        }

        .social-login {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background-color: var(--dark-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--light-text);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .social-btn.google:hover { color: #ea4335; border-color: #ea4335; }
        .social-btn.github:hover { color: #f0f6fc; border-color: #f0f6fc; }
        .social-btn.twitter:hover { color: #1da1f2; border-color: #1da1f2; }

        .auth-footer {
            text-align: center;
            color: var(--light-text-secondary);
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: color 0.3s ease;
        }

        .auth-link:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            animation: slideIn 0.5s ease;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: #fca5a5;
        }

        .message.success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: #a7f3d0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 25px;
            }
            
            .logo h1 {
                font-size: 2rem;
            }
            
            .social-login {
                grid-template-columns: 1fr;
            }
        }

        /* Анимация появления */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 5s ease-in-out infinite;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1>DarkAuth</h1>
            <p>Безопасный доступ в темных тонах</p>
        </div>

        <div class="auth-card">
            <div class="tabs">
                <div class="tab-indicator" id="tabIndicator"></div>
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <div class="form-container">
                <!-- Форма входа -->
                <form class="form active" id="loginForm">
                    <h2 class="form-title">Войдите в аккаунт</h2>
                    
                    <div class="message error" id="loginError">
                        <i class="fas fa-exclamation-circle"></i> Неверный email или пароль
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="loginEmail">Email</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input type="email" id="loginEmail" class="input-field" placeholder="example@mail.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="loginPassword">Пароль</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" data-target="loginPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="remember-forgot">
                        <label class="checkbox-group">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkbox-custom"></span>
                            <span>Запомнить меня</span>
                        </label>
                        <a href="#" class="forgot-link">Забыли пароль?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-sign-in-alt"></i> Войти
                    </button>

                    <div class="divider">
                        <span>Или войдите через</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="social-btn google">
                            <i class="fab fa-google"></i>
                        </button>
                        <button type="button" class="social-btn github">
                            <i class="fab fa-github"></i>
                        </button>
                        <button type="button" class="social-btn twitter">
                            <i class="fab fa-twitter"></i>
                        </button>
                    </div>

                    <div class="auth-footer">
                        Нет аккаунта? <a href="#" class="auth-link" data-tab="register">Зарегистрироваться</a>
                    </div>
                </form>

                <!-- Форма регистрации -->
                <form class="form" id="registerForm">
                    <h2 class="form-title">Создайте аккаунт</h2>
                    
                    <div class="message success" id="registerSuccess">
                        <i class="fas fa-check-circle"></i> Регистрация успешна!
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label" for="registerUsername">Имя пользователя</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <input type="text" id="registerUsername" class="input-field" placeholder="username" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="registerEmail">Email</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <input type="email" id="registerEmail" class="input-field" placeholder="example@mail.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="registerPassword">Пароль</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" id="registerPassword" class="input-field" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" data-target="registerPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="registerConfirmPassword">Подтвердите пароль</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" id="registerConfirmPassword" class="input-field" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" data-target="registerConfirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="checkbox-group" style="margin-bottom: 24px;">
                        <input type="checkbox" id="terms" required>
                        <span class="checkbox-custom"></span>
                        <span>Я согласен с <a href="#" class="forgot-link">условиями использования</a> и <a href="#" class="forgot-link">политикой конфиденциальности</a></span>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-user-plus"></i> Зарегистрироваться
                    </button>

                    <div class="auth-footer">
                        Уже есть аккаунт? <a href="#" class="auth-link" data-tab="login">Войти</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const forms = document.querySelectorAll('.form');
            const tabIndicator = document.getElementById('tabIndicator');
            const authLinks = document.querySelectorAll('.auth-link');
            const passwordToggles = document.querySelectorAll('.password-toggle');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginError = document.getElementById('loginError');
            const registerSuccess = document.getElementById('registerSuccess');

            // Переключение между вкладками
            function switchTab(tabName) {
                // Обновляем активные кнопки
                tabButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tabName);
                });

                // Перемещаем индикатор
                tabIndicator.style.transform = `translateX(${tabName === 'register' ? '100%' : '0'})`;

                // Показываем активную форму
                forms.forEach(form => {
                    form.classList.toggle('active', form.id === `${tabName}Form`);
                });

                // Скрываем сообщения
                loginError.classList.remove('show');
                registerSuccess.classList.remove('show');
            }

            // Обработчики для кнопок вкладок
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    switchTab(button.dataset.tab);
                });
            });

            // Обработчики для ссылок переключения
            authLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab(link.dataset.tab);
                });
            });

            // Переключение видимости пароля
            passwordToggles.forEach(toggle => {
                toggle.addEventListener('click', () => {
                    const targetId = toggle.dataset.target;
                    const passwordInput = document.getElementById(targetId);
                    const icon = toggle.querySelector('i');
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        passwordInput.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            });

            // Обработка формы входа
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                // Имитация проверки (в реальном приложении здесь будет запрос на сервер)
                if (email && password) {
                    // Успешный вход
                    loginError.classList.remove('show');
                    alert('Вход успешен! Добро пожаловать!');
                    
                    // Здесь обычно редирект на защищенную страницу
                } else {
                    // Ошибка входа
                    loginError.classList.add('show');
                }
            });

            // Обработка формы регистрации
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('registerUsername').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                const confirmPassword = document.getElementById('registerConfirmPassword').value;
                const terms = document.getElementById('terms').checked;
                
                // Валидация
                if (!terms) {
                    alert('Пожалуйста, примите условия использования');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('Пароли не совпадают!');
                    return;
                }
                
                if (password.length < 8) {
                    alert('Пароль должен содержать минимум 8 символов');
                    return;
                }
                
                // Имитация успешной регистрации
                registerSuccess.classList.add('show');
                
                // Через 2 секунды переключаемся на вкладку входа
                setTimeout(() => {
                    switchTab('login');
                    // Автозаполнение email для удобства
                    document.getElementById('loginEmail').value = email;
                }, 2000);
            });

            // Социальные кнопки
            document.querySelectorAll('.social-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const provider = this.classList.contains('google') ? 'Google' : 
                                   this.classList.contains('github') ? 'GitHub' : 'Twitter';
                    alert(`Вход через ${provider} (имитация)`);
                });
            });

            // Забыли пароль
            document.querySelector('.forgot-link').addEventListener('click', function(e) {
                e.preventDefault();
                const email = prompt('Введите ваш email для восстановления пароля:');
                if (email) {
                    alert(`Инструкция по восстановлению отправлена на ${email}`);
                }
            });

            // Имитация загрузки при нажатии на кнопки
            document.querySelectorAll('.submit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // В реальном приложении здесь будет отправка формы
                    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Обработка...';
                    setTimeout(() => {
                        this.innerHTML = this.closest('form').id === 'loginForm' 
                            ? '<i class="fas fa-sign-in-alt"></i> Войти'
                            : '<i class="fas fa-user-plus"></i> Зарегистрироваться';
                    }, 1500);
                });
            });

            // Анимация появления элементов
            setTimeout(() => {
                document.querySelector('.auth-card').style.opacity = '1';
                document.querySelector('.auth-card').style.transform = 'translateY(0)';
            }, 100);

            // Стиль для плавного появления
            document.querySelector('.auth-card').style.opacity = '0';
            document.querySelector('.auth-card').style.transform = 'translateY(20px)';
            document.querySelector('.auth-card').style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        });
    </script>
</body>
</html>
